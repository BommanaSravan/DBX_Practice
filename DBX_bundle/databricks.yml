# This is a Declarative Automation Bundle definition for DBX_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DBX_bundle
  uuid: 3cc8d63d-055f-4349-bd64-df4444f96cc6

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-3ded6f24-c67e.cloud.databricks.com
    variables:
      catalog: dbx_dev
      schema: dev_schema
  prod:
    mode: production
    workspace:
      host: https://dbc-3ded6f24-c67e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bommanasravan@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bommanasravan@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbx_prod
      schema: prod_schema
    permissions:
      - user_name: bommanasravan@gmail.com
        level: CAN_MANAGE
