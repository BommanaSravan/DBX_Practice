
name: Deploy Databricks Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: databricks-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Databricks Production
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.9.0

      - name: Verify Databricks authentication
        run: databricks current-user me

      - name: Validate bundle
        run: databricks bundle validate --target prod

      - name: Deploy bundle
        run: databricks bundle deploy --target prod
